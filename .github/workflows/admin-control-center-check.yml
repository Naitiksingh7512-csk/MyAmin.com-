name: Admin Control Center Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "admin-command-center.js"
      - "ma-control-9f2c7a61b4e8.html"
      - "supabase/functions/owner-control-center/**"
      - ".github/workflows/admin-control-center-check.yml"
  push:
    branches: [main, admin-control-center-staging]
    paths:
      - "admin-command-center.js"
      - "ma-control-9f2c7a61b4e8.html"
      - "supabase/functions/owner-control-center/**"
      - ".github/workflows/admin-control-center-check.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check browser module syntax
        run: node --check admin-command-center.js
      - name: Type-check secure Edge Function
        run: deno check supabase/functions/owner-control-center/index.ts
